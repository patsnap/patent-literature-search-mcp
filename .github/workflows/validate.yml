name: Build and test MCP server

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_upstream:
        description: Run the live PatSnap upstream smoke test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required repository files
        run: |
          test -s README.md
          test -s LICENSE
          test -s glama.json
          test -s server.json
          test -s Dockerfile

      - name: Validate glama.json
        run: python -m json.tool glama.json >/dev/null

      - name: Validate server.json
        run: |
          python -m json.tool server.json >/dev/null
          test "$(jq -r '.name' server.json)" = "io.github.patsnap/patent-literature-search-mcp"
          test "$(jq -r '.version' server.json)" = "$(node -p "require('./package.json').version")"
          test "$(jq -r '.remotes[0].type' server.json)" = "streamable-http"
          test "$(jq -r '.remotes[0].url' server.json)" = \
            "https://connect.patsnap.com/2b0355/logic-mcp?apikey={api_key}"

      - name: Install dependencies
        run: npm ci

      - name: Run MCP protocol tests
        run: npm test

      - name: Run opt-in PatSnap upstream test
        if: github.event_name == 'workflow_dispatch' && inputs.run_upstream
        env:
          PATSNAP_TEST_API_KEY: ${{ secrets.PATSNAP_TEST_API_KEY }}
        run: npm run test:upstream

      - name: Build Docker image
        run: docker build --tag patent-literature-search-mcp:test .

      - name: Test MCP handshake in Docker
        run: npm run test:docker

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-registry:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          jq --arg version "$VERSION" \
            '.version = $version' \
            server.json > server.tmp
          mv server.tmp server.json

      - name: Validate Registry metadata
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
